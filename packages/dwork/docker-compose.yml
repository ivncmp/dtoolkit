services:
  dwork:
    build:
      context: ../..
      dockerfile: packages/dwork/Dockerfile
    container_name: dwork
    restart: unless-stopped
    ports:
      - "${DWORK_PORT:-7881}:7881"
      - "${DWORK_DASHBOARD_PORT:-7882}:7882"
    volumes:
      - ${DWORK_DATA_HOST:-./.data}:/data
    env_file:
      - .env
