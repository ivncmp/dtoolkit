    /* ── TASK DETAIL MODAL ────────────────────────────────── */
    function TaskDetailModal({ task, onClose, onUpdate }) {
      const [content, setContent] = useState('');
      const [docId, setDocId] = useState(null);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [saved, setSaved] = useState(false);
      const [creating, setCreating] = useState(false);

      const projectSlug = task._project || task.project_slug;

      useEffect(() => {
        let cancelled = false;
        (async () => {
          setLoading(true);
          if (task.detail_path) {
            const docs = await api(`/projects/${projectSlug}/docs`).catch(() => []);
            const doc = docs.find(d => d.file_path === task.detail_path || d.file_path === `docs/${task.detail_path}`);
            if (doc && !cancelled) {
              const full = await api(`/docs/${doc.id}`).catch(() => null);
              if (full && !cancelled) {
                setDocId(doc.id);
                const body = full.content.replace(/^---[\s\S]*?---\n*/, '');
                setContent(body);
              }
            }
          }
          if (!cancelled) setLoading(false);
        })();
        return () => { cancelled = true; };
      }, [task]);

      const handleSave = async () => {
        if (!docId) return;
        setSaving(true);
        await api(`/docs/${docId}`, { method: 'PATCH', body: JSON.stringify({ body: content }) }).catch(() => { });
        setSaving(false);
        setSaved(true);
        setTimeout(() => setSaved(false), 2000);
        if (onUpdate) onUpdate();
      };

      const handleCreate = async () => {
        setCreating(true);
        const slug = task.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40);
        const body = `# ${task.title}\n\n`;
        const result = await api(`/projects/${projectSlug}/docs`, {
          method: 'POST',
          body: JSON.stringify({ title: task.title, body, type: 'detail' })
        }).catch(() => null);
        if (result) {
          await api(`/tasks/${task.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ detail: result.file_path })
          }).catch(() => { });
          setDocId(result.id);
          setContent(body);
          if (onUpdate) onUpdate();
        }
        setCreating(false);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal modal-wide" onClick={e => e.stopPropagation()}>
            <span className="task-id-label" style={{ fontSize: 12, marginBottom: 6 }}>{task.id}</span>
            <div className="modal-title">{task.title}</div>
            <div className="task-detail-header">
              <span className="badge badge-status">{task.status}</span>
              <span className="badge badge-priority">{task.priority}</span>
              {(task._projectName || projectSlug) && <span className="badge badge-project">{task._projectName || projectSlug}</span>}
              {task.type !== 'task' && <span className="badge badge-status">{task.type}</span>}
              {task.estimate && <span className="badge badge-priority">{task.estimate}</span>}
              {task.deadline && <span className="badge badge-priority">{task.deadline}</span>}
            </div>
            {loading ? (
              <div className="task-detail-empty">Loading...</div>
            ) : docId ? (
              <div>
                <textarea className="task-detail-editor" value={content} onChange={e => setContent(e.target.value)} />
                <div className="modal-actions" style={{ alignItems: 'center' }}>
                  <span className={`task-detail-saved ${saved ? 'show' : ''}`}>Saved</span>
                  <button className="btn-cancel" onClick={onClose}>Close</button>
                  <button className="btn-primary" onClick={handleSave} disabled={saving}>{saving ? 'Saving...' : 'Save'}</button>
                </div>
              </div>
            ) : (
              <div>
                <div className="task-detail-empty">No detail document linked to this task.</div>
                <div className="modal-actions">
                  <button className="btn-cancel" onClick={onClose}>Close</button>
                  <button className="btn-primary" onClick={handleCreate} disabled={creating}>{creating ? 'Creating...' : 'Add Detail'}</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ── OVERVIEW VIEW ────────────────────────────────────── */
    function OverviewView({ nav }) {
      const [data, setData] = useState(null);
      const [allTasks, setAllTasks] = useState([]);
      const [dragOver, setDragOver] = useState(null);
      const [dragging, setDragging] = useState(null);
      const [selectedTask, setSelectedTask] = useState(null);
      const colRefs = React.useRef({});

      const loadAll = useCallback(async () => {
        const overview = await api('/overview').catch(() => null);
        if (!overview) return;
        setData(overview);
        const taskArrays = await Promise.all(
          overview.projects.map(p => api(`/projects/${p.slug}/tasks`).then(tasks => tasks.map(t => ({ ...t, _project: p.slug, _projectName: p.name }))).catch(() => []))
        );
        setAllTasks(taskArrays.flat());
      }, []);
      useEffect(() => { loadAll(); }, [loadAll]);

      const grouped = {};
      COLUMNS.forEach(c => grouped[c.key] = []);
      allTasks.forEach(t => { if (grouped[t.status]) grouped[t.status].push(t); });

      const moveTo = async (taskId, newStatus) => {
        const task = allTasks.find(t => t.id === taskId);
        if (!task || task.status === newStatus) return;
        try { await api(`/tasks/${task.id}`, { method: 'PATCH', body: JSON.stringify({ status: newStatus }) }); loadAll(); } catch { }
      };
      const handleDragStart = (e, task) => { setDragging(task.id); e.dataTransfer.effectAllowed = 'move'; };
      const handleDrop = async (e, newStatus) => { e.preventDefault(); setDragOver(null); if (dragging) { await moveTo(dragging, newStatus); setDragging(null); } };
      const colAtPoint = (x, y) => {
        for (const [key, el] of Object.entries(colRefs.current)) {
          if (!el) continue;
          const r = el.getBoundingClientRect();
          if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return key;
        }
        return null;
      };
      const onTouchStart = (task) => { setDragging(task.id); };
      const onTouchMove = (e) => { const t = e.touches[0]; setDragOver(colAtPoint(t.clientX, t.clientY)); };
      const onTouchEnd = async (e) => {
        if (!dragging) return;
        const t = e.changedTouches[0];
        const col = colAtPoint(t.clientX, t.clientY);
        setDragOver(null);
        if (col) await moveTo(dragging, col);
        setDragging(null);
      };

      if (!data) return <div className="loading">Loading...</div>;

      return (
        <div className="page">
          <h1 className="page-title">Overview</h1>
          <div className="stats-row">
            <div className="stat-card"><div className="stat-num">{data.totalProjects}</div><div className="stat-lbl">Projects</div></div>
            <div className="stat-card"><div className="stat-num">{data.totalTasks}</div><div className="stat-lbl">Tasks</div></div>
            <div className="stat-card"><div className="stat-num">{data.totalDocs}</div><div className="stat-lbl">Documents</div></div>
          </div>
          <div className="sec-head"><span className="sec-title">Projects</span><span className="sec-badge">{data.projects.length}</span></div>
          <div className="card-grid" style={{ marginBottom: 28 }}>
            {data.projects.map(p => (
              <div key={p.slug} className="card" onClick={() => nav(`#/project/${p.slug}`)}>
                <div className="card-name">{p.name}</div>
                <div style={{ display: 'flex', gap: 6, marginTop: 8, flexWrap: 'wrap' }}>
                  {Object.entries(p.tasksByStatus || {}).map(([s, c]) => (
                    <span key={s} className={`stat-badge s-${s}`}>{s}: {c}</span>
                  ))}
                </div>
              </div>
            ))}
          </div>
          <div className="sec-head"><span className="sec-title">All Tasks</span><span className="sec-badge">{allTasks.length}</span></div>
          <div className="kanban">
            {COLUMNS.map(col => (
              <div key={col.key} className="kanban-col" ref={el => colRefs.current[col.key] = el}
                onDragOver={e => { e.preventDefault(); setDragOver(col.key); }} onDragLeave={() => setDragOver(null)} onDrop={e => handleDrop(e, col.key)}>
                <div className="kanban-col-header" style={{ color: col.color }}>
                  {col.label} <span className="kanban-col-count">{grouped[col.key].length}</span>
                </div>
                <div className={`kanban-cards ${dragOver === col.key ? 'drag-over' : ''}`}>
                  {grouped[col.key].map(task => (
                    <div key={task.id} className={`kanban-card ${dragging === task.id ? 'dragging' : ''}`}
                      draggable onDragStart={e => handleDragStart(e, task)} onDragEnd={() => setDragging(null)}
                      onTouchStart={() => onTouchStart(task)} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
                      onClick={() => { if (!dragging) setSelectedTask(task); }} style={{ cursor: 'pointer' }}>
                      <span className="task-id-label">{task.id}</span>
                      <div className="kanban-card-title">{task.title}</div>
                      <div className="kanban-card-meta">
                        <span className={task.priority.toLowerCase()}>{task.priority}</span>
                        <span style={{ background: 'var(--accent-light)', color: 'var(--accent)', fontSize: 9, padding: '2px 6px', borderRadius: 3, fontFamily: 'var(--mono)', fontWeight: 600 }}>{task._projectName}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
          {selectedTask && <TaskDetailModal task={selectedTask} onClose={() => setSelectedTask(null)} onUpdate={loadAll} />}
        </div>
      );
    }

    /* ── GRAPHS ──────────────────────────────────────────── */
    function GraphsView({ nav }) {
      const [graphs, setGraphs] = useState([]);

      useEffect(() => { api('/graphs').then(setGraphs).catch(() => { }); }, []);

      return (
        <div className="page">
          <h1 className="page-title">Graphs</h1>
          {graphs.length === 0 ? (
            <div className="empty">No graphs yet. Run <code>dcontext sync</code> to index and upload a codebase.</div>
          ) : (
            <div className="card-grid">
              {graphs.map(g => (
                <div key={g.name} className="card" onClick={() => nav(`#/graph/${g.name}`)}>
                  <div className="card-name">{g.name}</div>
                  <div className="card-desc">Synced {new Date(g.synced_at).toLocaleDateString()}</div>
                  <div className="card-stats">
                    <span className="stat-badge">{g.node_count.toLocaleString()} symbols</span>
                    <span className="stat-badge">{g.edge_count.toLocaleString()} edges</span>
                    <span className="stat-badge">{g.file_count} files</span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    const KIND_COLORS = {
      'function': '#4a90d9', 'method': '#7c5cbf', 'class': '#e06c75', 'interface': '#56b6c2',
      'variable': '#98c379', 'constant': '#d19a66', 'type_alias': '#c678dd', 'enum': '#be5046',
      'import': '#868e96', 'file': '#495057', 'module': '#495057', 'route': '#e5c07b',
      'property': '#61afef', 'field': '#61afef', 'component': '#e06c75', 'struct': '#e06c75',
      'namespace': '#495057', 'parameter': '#abb2bf', 'export': '#868e96', 'trait': '#56b6c2',
    };

    function GraphDetail({ name, nav }) {
      const [stats, setStats] = useState(null);
      const [tab, setTab] = useState('explore');
      const [search, setSearch] = useState('');
      const [results, setResults] = useState([]);
      const [selectedNode, setSelectedNode] = useState(null);
      const [graphData, setGraphData] = useState(null);
      const [graphType, _setGraphType] = useState('callgraph');
      const graphTypeRef = useRef('callgraph');
      const setGraphType = (t) => { graphTypeRef.current = t; _setGraphType(t); };
      const [legendFilter, setLegendFilter] = useState(null);
      const [showMinimap, setShowMinimap] = useState(true);
      const [history, setHistory] = useState([]);
      const cyRef = useRef(null);
      const containerRef = useRef(null);
      const minimapRef = useRef(null);
      const minimapTimerRef = useRef(null);
      const layoutDoneRef = useRef(false);
      const currentRef = useRef({ data: null, type: 'callgraph', node: null });

      const loadGraph = useCallback((nodeId, type) => {
        const endpoint = type === 'impact'
          ? `/graphs/${name}/nodes/${nodeId}/impact?depth=2`
          : type === 'callgraph'
            ? `/graphs/${name}/nodes/${nodeId}/callgraph?depth=2`
            : `/graphs/${name}/nodes/${nodeId}/hierarchy`;
        const cur = currentRef.current;
        if (cur.data) {
          setHistory(h => [...h, { data: cur.data, type: cur.type, node: cur.node }]);
        }
        api(endpoint).then(data => {
          setGraphType(type);
          setGraphData(data);
          setSelectedNode(nodeId);
          currentRef.current = { data, type, node: nodeId };
        }).catch(() => { });
      }, [name]);

      const goBack = useCallback(() => {
        setHistory(h => {
          if (h.length === 0) return h;
          const prev = h[h.length - 1];
          setGraphData(prev.data);
          setGraphType(prev.type);
          setSelectedNode(prev.node);
          currentRef.current = { data: prev.data, type: prev.type, node: prev.node };
          return h.slice(0, -1);
        });
      }, []);

      useEffect(() => {
        api(`/graphs/${name}/stats`).then(setStats).catch(() => { });
        api(`/graphs/${name}/graph?kind=function,class,method&limit=200`).then(data => {
          setGraphType('overview');
          setGraphData(data);
          currentRef.current = { data, type: 'overview', node: null };
        }).catch(() => { });
      }, [name]);

      useEffect(() => {
        if (!search || search.length < 2) { setResults([]); return; }
        const t = setTimeout(() => {
          api(`/graphs/${name}/nodes?q=${encodeURIComponent(search)}&limit=20`).then(setResults).catch(() => { });
        }, 300);
        return () => clearTimeout(t);
      }, [search, name]);

      const getLayout = useCallback((type, nodeCount) => {
        if (type === 'hierarchy') {
          if (nodeCount > 80) {
            return {
              name: 'cose',
              animate: true,
              animationDuration: 600,
              nodeRepulsion: () => 25000,
              idealEdgeLength: () => 120,
              edgeElasticity: () => 70,
              gravity: 0.2,
              numIter: 400,
              padding: 40,
            };
          }
          return {
            name: 'dagre',
            rankDir: 'TB',
            nodeSep: 60,
            rankSep: 80,
            edgeSep: 20,
            animate: true,
            animationDuration: 500,
            padding: 40,
          };
        }
        if (type === 'callgraph') {
          if (nodeCount > 80) {
            return {
              name: 'cose',
              animate: true,
              animationDuration: 600,
              nodeRepulsion: () => 25000,
              idealEdgeLength: () => 120,
              edgeElasticity: () => 70,
              gravity: 0.2,
              numIter: 400,
              padding: 40,
            };
          }
          return {
            name: 'dagre',
            rankDir: 'LR',
            nodeSep: 40,
            rankSep: 120,
            edgeSep: 15,
            animate: true,
            animationDuration: 500,
            padding: 40,
          };
        }
        if (type === 'overview') {
          return {
            name: 'cose',
            animate: true,
            animationDuration: 800,
            nodeRepulsion: () => nodeCount > 100 ? 30000 : 20000,
            idealEdgeLength: () => nodeCount > 100 ? 100 : 140,
            edgeElasticity: () => 60,
            gravity: nodeCount > 100 ? 0.15 : 0.25,
            numIter: 400,
            padding: 50,
          };
        }
        return {
          name: 'cose',
          animate: true,
          animationDuration: 600,
          nodeRepulsion: () => 18000,
          idealEdgeLength: () => nodeCount > 80 ? 120 : 160,
          edgeElasticity: () => 80,
          gravity: 0.3,
          numIter: nodeCount > 100 ? 300 : 500,
          padding: 40,
        };
      }, []);

      const updateMinimap = useCallback(() => {
        const cy = cyRef.current;
        const canvas = minimapRef.current;
        if (!cy || !canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        const bb = cy.elements().boundingBox();
        if (bb.w === 0 || bb.h === 0) return;

        const scale = Math.min(w / bb.w, h / bb.h) * 0.85;
        const offX = (w - bb.w * scale) / 2 - bb.x1 * scale;
        const offY = (h - bb.h * scale) / 2 - bb.y1 * scale;

        cy.edges().forEach(edge => {
          const sp = edge.sourceEndpoint();
          const tp = edge.targetEndpoint();
          ctx.beginPath();
          ctx.moveTo(sp.x * scale + offX, sp.y * scale + offY);
          ctx.lineTo(tp.x * scale + offX, tp.y * scale + offY);
          ctx.strokeStyle = 'rgba(128,128,128,0.2)';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        });

        cy.nodes().forEach(node => {
          const pos = node.position();
          const x = pos.x * scale + offX;
          const y = pos.y * scale + offY;
          ctx.beginPath();
          ctx.arc(x, y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = KIND_COLORS[node.data('kind')] || '#868e96';
          ctx.fill();
        });

        const ext = cy.extent();
        ctx.strokeStyle = 'rgba(74,144,217,0.6)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(
          ext.x1 * scale + offX, ext.y1 * scale + offY,
          ext.w * scale, ext.h * scale
        );
      }, []);

      const scheduleMinimap = useCallback(() => {
        if (minimapTimerRef.current) cancelAnimationFrame(minimapTimerRef.current);
        minimapTimerRef.current = requestAnimationFrame(updateMinimap);
      }, [updateMinimap]);

      useEffect(() => {
        if (!graphData || !containerRef.current) return;
        if (cyRef.current) { cyRef.current.stop(); cyRef.current.destroy(); }
        layoutDoneRef.current = false;

        const nameCounts = {};
        for (const n of graphData.nodes || []) nameCounts[n.name] = (nameCounts[n.name] || 0) + 1;

        const makeLabel = (n) => {
          if (nameCounts[n.name] <= 1 && n.name.length > 12) return n.name;
          const file = (n.filePath || '').split('/').pop()?.replace(/\.[^.]+$/, '') || '';
          if (!file || file === n.name) return n.name;
          return `${file}.${n.name}`;
        };

        const elements = [];
        for (const n of graphData.nodes || []) {
          elements.push({ data: { id: n.id, label: makeLabel(n), shortLabel: n.name, kind: n.kind, file: n.filePath, line: n.startLine } });
        }
        const seenEdges = new Set();
        for (const e of graphData.edges || []) {
          const key = `${e.source}→${e.target}→${e.kind}`;
          if (seenEdges.has(key)) continue;
          seenEdges.add(key);
          elements.push({ data: { source: e.source, target: e.target, kind: e.kind } });
        }
        if (elements.length === 0) return;

        const isDark = document.documentElement.getAttribute('data-palette') === 'ocean';
        const textColor = isDark ? '#ddd' : '#333';
        const edgeColor = isDark ? 'rgba(255,255,255,0.45)' : 'rgba(0,0,0,0.18)';
        const edgeLabelColor = isDark ? 'rgba(255,255,255,0.55)' : 'rgba(0,0,0,0.3)';
        const highlightColor = isDark ? '#6ea8fe' : '#4a90d9';
        const nodeCount = (graphData.nodes || []).length;

        const curveStyle = graphTypeRef.current === 'hierarchy' ? 'taxi' : 'bezier';

        const cy = cytoscape({
          container: containerRef.current,
          elements,
          style: [
            {
              selector: 'node', style: {
                'label': 'data(label)',
                'font-size': 10,
                'font-family': 'DM Sans, sans-serif',
                'font-weight': 500,
                'text-valign': 'center',
                'text-halign': 'right',
                'text-margin-x': 6,
                'text-max-width': 140,
                'text-wrap': 'ellipsis',
                'width': (el) => Math.max(18, Math.min(40, 18 + el.degree() * 3)),
                'height': (el) => Math.max(18, Math.min(40, 18 + el.degree() * 3)),
                'background-color': (el) => KIND_COLORS[el.data('kind')] || '#868e96',
                'background-opacity': 0.85,
                'border-width': 0,
                'color': textColor,
                'text-outline-width': isDark ? 3 : 2,
                'text-outline-color': isDark ? '#1a1a2e' : '#fff',
                'text-outline-opacity': isDark ? 1 : 0.8,
                'overlay-opacity': 0,
                'transition-property': 'background-opacity, border-width, border-color, opacity',
                'transition-duration': '0.2s',
              }
            },
            {
              selector: 'node:selected', style: {
                'border-width': 3,
                'border-color': highlightColor,
                'background-opacity': 1,
              }
            },
            {
              selector: 'node.highlighted', style: {
                'background-opacity': 1,
                'border-width': 2,
                'border-color': highlightColor,
              }
            },
            {
              selector: 'node.faded', style: {
                'opacity': 0.2,
              }
            },
            {
              selector: 'edge', style: {
                'width': isDark ? 1.5 : 1,
                'line-color': edgeColor,
                'target-arrow-shape': 'triangle',
                'target-arrow-color': edgeColor,
                'arrow-scale': isDark ? 0.7 : 0.6,
                'curve-style': curveStyle,
                'label': 'data(kind)',
                'font-size': 8,
                'color': edgeLabelColor,
                'text-rotation': 'autorotate',
                'text-margin-y': -7,
                'text-opacity': 0.7,
                'transition-property': 'line-color, target-arrow-color, width, opacity',
                'transition-duration': '0.2s',
              }
            },
            {
              selector: 'edge.highlighted', style: {
                'line-color': highlightColor,
                'target-arrow-color': highlightColor,
                'width': 2,
                'text-opacity': 1,
              }
            },
            {
              selector: 'edge.faded', style: {
                'opacity': 0.1,
              }
            },
            {
              selector: 'edge:selected', style: {
                'line-color': highlightColor,
                'target-arrow-color': highlightColor,
                'width': 2,
              }
            },
            {
              selector: 'node.kind-hidden', style: {
                'display': 'none',
              }
            },
          ],
          layout: getLayout(graphTypeRef.current, nodeCount),
          minZoom: 0.1, maxZoom: 6,
          wheelSensitivity: 1,
        });

        // Hover: highlight neighbors
        cy.on('mouseover', 'node', (e) => {
          const node = e.target;
          const neighborhood = node.closedNeighborhood();
          cy.elements().not(neighborhood).addClass('faded');
          neighborhood.nodes().addClass('highlighted');
          neighborhood.edges().addClass('highlighted');
        });
        cy.on('mouseout', 'node', () => {
          cy.elements().removeClass('faded highlighted');
        });

        // Tap: select (center handled by selectedNode effect)
        cy.on('tap', 'node', (e) => {
          setSelectedNode(e.target.data().id);
        });

        // Double-click: load call graph for that node
        cy.on('dbltap', 'node', (e) => {
          loadGraph(e.target.data().id, 'callgraph');
        });

        // Tap background: deselect
        cy.on('tap', (e) => {
          if (e.target === cy) {
            setSelectedNode(null);
            cy.elements().removeClass('faded highlighted');
          }
        });

        // LOD: hide labels at low zoom
        cy.on('zoom', () => {
          const zoom = cy.zoom();
          if (zoom < 0.3) {
            cy.style().selector('node').style({ 'label': '' }).update();
            cy.style().selector('edge').style({ 'label': '' }).update();
          } else if (zoom < 0.6) {
            cy.style().selector('node').style({ 'label': 'data(shortLabel)' }).update();
            cy.style().selector('edge').style({ 'label': '' }).update();
          } else {
            cy.style().selector('node').style({ 'label': 'data(label)' }).update();
            cy.style().selector('edge').style({ 'label': 'data(kind)' }).update();
          }
          scheduleMinimap();
        });

        cy.on('pan', scheduleMinimap);
        cy.on('layoutstop', () => { layoutDoneRef.current = true; scheduleMinimap(); });

        // Context menu
        if (cy.cxtmenu) {
          cy.cxtmenu({
            selector: 'node',
            commands: [
              {
                content: '<span style="font-size:11px">Call graph</span>',
                select: (el) => loadGraph(el.data().id, 'callgraph'),
              },
              {
                content: '<span style="font-size:11px">Impact</span>',
                select: (el) => loadGraph(el.data().id, 'impact'),
              },
              {
                content: '<span style="font-size:11px">Hierarchy</span>',
                select: (el) => loadGraph(el.data().id, 'hierarchy'),
              },
              {
                content: '<span style="font-size:11px">Center</span>',
                select: (el) => cy.animate({ fit: { eles: el.closedNeighborhood(), padding: 50 }, duration: 400 }),
              },
            ],
            fillColor: isDark ? 'rgba(30,30,50,0.92)' : 'rgba(255,255,255,0.95)',
            activeFillColor: highlightColor,
            activePadding: 10,
            indicatorSize: 14,
            separatorWidth: 3,
            spotlightPadding: 4,
            adaptativeNodeSpotlightRadius: true,
            minSpotlightRadius: 16,
            maxSpotlightRadius: 32,
            itemColor: isDark ? '#ddd' : '#333',
            itemTextShadowColor: 'transparent',
          });
        }

        cyRef.current = cy;

        setTimeout(scheduleMinimap, 700);

        return () => {
          if (minimapTimerRef.current) cancelAnimationFrame(minimapTimerRef.current);
          if (cyRef.current) { cyRef.current.stop(); cyRef.current.destroy(); cyRef.current = null; }
        };
      }, [graphData, getLayout, loadGraph, scheduleMinimap]);

      // Sync panel selection → graph selection (skip during layout animation)
      useEffect(() => {
        const cy = cyRef.current;
        if (!cy || !selectedNode) return;
        cy.nodes().unselect();
        const node = cy.$id(selectedNode);
        if (node.length) {
          node.select();
          if (layoutDoneRef.current) {
            const neighborhood = node.closedNeighborhood();
            cy.animate({ fit: { eles: neighborhood, padding: 60 }, duration: 400 });
          }
        }
      }, [selectedNode]);

      // Legend filter: hide/show nodes by kind
      useEffect(() => {
        const cy = cyRef.current;
        if (!cy) return;
        if (legendFilter) {
          cy.nodes().forEach(n => {
            if (n.data('kind') !== legendFilter) n.addClass('kind-hidden');
            else n.removeClass('kind-hidden');
          });
        } else {
          cy.nodes().removeClass('kind-hidden');
        }
      }, [legendFilter]);

      const selectedInfo = graphData?.nodes?.find(n => n.id === selectedNode);
      const visibleKinds = useMemo(() => {
        if (!graphData?.nodes) return [];
        const kinds = {};
        for (const n of graphData.nodes) kinds[n.kind] = (kinds[n.kind] || 0) + 1;
        return Object.entries(kinds).sort((a, b) => b[1] - a[1]);
      }, [graphData]);

      const handleFit = () => { if (cyRef.current) cyRef.current.animate({ fit: { padding: 40 }, duration: 400 }); };
      const handleZoomIn = () => {
        const cy = cyRef.current;
        if (!cy) return;
        const ext = cy.extent();
        cy.animate({ zoom: { level: cy.zoom() * 1.4, position: { x: (ext.x1 + ext.x2) / 2, y: (ext.y1 + ext.y2) / 2 } }, duration: 200 });
      };
      const handleZoomOut = () => {
        const cy = cyRef.current;
        if (!cy) return;
        const ext = cy.extent();
        cy.animate({ zoom: { level: cy.zoom() / 1.4, position: { x: (ext.x1 + ext.x2) / 2, y: (ext.y1 + ext.y2) / 2 } }, duration: 200 });
      };

      if (!stats) return <div className="loading">Loading...</div>;

      return (
        <div className="page page-graph">
          <button className="back-btn" onClick={() => nav('#/graphs')}>&#8592; All Graphs</button>
          <h1 className="page-title" style={{ margin: '0 0 4px' }}>{name}</h1>
          <div className="page-subtitle" style={{ marginBottom: 16 }}>
            {stats.nodeCount.toLocaleString()} symbols &middot; {stats.edgeCount.toLocaleString()} edges &middot; {stats.fileCount} files
          </div>

          <div className="card-stats" style={{ marginBottom: 16 }}>
            {Object.entries(stats.nodesByKind || {}).slice(0, 8).map(([kind, count]) => (
              <span key={kind} className="stat-badge" style={{ background: KIND_COLORS[kind] || '#868e96', color: '#fff' }}>
                {kind}: {count}
              </span>
            ))}
          </div>

          <div className="tabs">
            <button className={`tab ${tab === 'explore' ? 'active' : ''}`} onClick={() => setTab('explore')}>Explore</button>
            <button className={`tab ${tab === 'files' ? 'active' : ''}`} onClick={() => setTab('files')}>Files</button>
          </div>

          <div style={{ display: tab === 'explore' ? 'flex' : 'none', flexDirection: 'column', flex: 1, minHeight: 0 }}>
            <div style={{ marginBottom: 10, position: 'relative' }}>
              <input className="form-input" placeholder="Search symbols..." value={search}
                onChange={e => setSearch(e.target.value)} style={{ width: '100%' }} />
              {results.length > 0 && (
                <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 20, maxHeight: 240, overflow: 'auto', border: '1px solid var(--border)', borderRadius: '0 0 var(--r) var(--r)', background: 'var(--surface)', boxShadow: '0 8px 24px rgba(0,0,0,.1)' }}>
                  {results.map(r => (
                    <div key={r.node.id}
                      style={{ padding: '8px 12px', borderBottom: '1px solid var(--border-subtle)', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8, fontSize: 13 }}
                      onMouseEnter={e => e.currentTarget.style.background = 'var(--surface-2)'}
                      onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                      onClick={() => { setSearch(''); setResults([]); loadGraph(r.node.id, 'callgraph'); }}>
                      <span className="stat-badge" style={{ background: KIND_COLORS[r.node.kind] || '#868e96', color: '#fff', fontSize: 10 }}>{r.node.kind}</span>
                      <span style={{ fontWeight: 500 }}>{r.node.name}</span>
                      <span style={{ color: 'var(--text-3)', fontSize: 11, fontFamily: 'var(--mono)', marginLeft: 'auto' }}>{r.node.filePath}:{r.node.startLine}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {visibleKinds.length > 0 && (
              <div className="graph-legend">
                {visibleKinds.map(([kind, count]) => (
                  <div key={kind}
                    className={`graph-legend-item ${legendFilter && legendFilter !== kind ? 'dimmed' : ''}`}
                    onClick={() => setLegendFilter(legendFilter === kind ? null : kind)}
                    title={`${count} ${kind} nodes — click to filter`}>
                    <span className="graph-legend-dot" style={{ background: KIND_COLORS[kind] || '#868e96' }} />
                    <span>{kind}</span>
                    <span style={{ color: 'var(--text-3)' }}>({count})</span>
                  </div>
                ))}
              </div>
            )}

            <div style={{ flex: 1, display: 'flex', gap: 12, minHeight: 0 }}>
              <div style={{ flex: 1, position: 'relative', border: '1px solid var(--border)', borderRadius: 'var(--r)', background: 'var(--surface)', overflow: 'hidden' }}>
                <div ref={containerRef} style={{ width: '100%', height: '100%' }} />
                <div className="graph-toolbar">
                  {history.length > 0 && <button onClick={goBack} title="Go back">&#8592;</button>}
                  <button onClick={handleZoomIn} title="Zoom in">+</button>
                  <button onClick={handleZoomOut} title="Zoom out">&minus;</button>
                  <button onClick={handleFit} title="Fit to view">&#8982;</button>
                  <button onClick={() => { setShowMinimap(v => { if (!v) setTimeout(scheduleMinimap, 50); return !v; }); }} title="Toggle minimap" style={{ opacity: showMinimap ? 1 : 0.5 }}>&#9638;</button>
                </div>
                {showMinimap && (
                  <div className="graph-minimap">
                    <canvas ref={minimapRef} width={160} height={110} style={{ width: '100%', height: '100%' }} />
                  </div>
                )}
              </div>
              {selectedInfo && (
                <div style={{ width: 320, flexShrink: 0, border: '1px solid var(--border)', borderRadius: 'var(--r)', background: 'var(--surface)', padding: 20, overflow: 'auto', fontSize: 13 }}>
                  <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 6, letterSpacing: '-.02em' }}>{selectedInfo.name}</div>
                  <div style={{ marginBottom: 8 }}>
                    <span className="stat-badge" style={{ background: KIND_COLORS[selectedInfo.kind] || '#868e96', color: '#fff', fontSize: 10 }}>{selectedInfo.kind}</span>
                    <span className="stat-badge" style={{ marginLeft: 6, fontSize: 10 }}>{graphType}</span>
                  </div>
                  <div style={{ color: 'var(--text-2)', fontSize: 11, fontFamily: 'var(--mono)', marginBottom: 10, lineHeight: 1.5 }}>{selectedInfo.filePath}:{selectedInfo.startLine}-{selectedInfo.endLine}</div>
                  {selectedInfo.signature && <div style={{ padding: 10, background: 'var(--surface-2)', borderRadius: 6, fontFamily: 'var(--mono)', fontSize: 11, wordBreak: 'break-all', marginBottom: 14, lineHeight: 1.5 }}>{selectedInfo.signature}</div>}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                    <button className="btn-sm" onClick={() => loadGraph(selectedInfo.id, 'callgraph')}>Call graph</button>
                    <button className="btn-sm" onClick={() => loadGraph(selectedInfo.id, 'impact')}>Impact radius</button>
                    <button className="btn-sm" onClick={() => loadGraph(selectedInfo.id, 'hierarchy')}>Type hierarchy</button>
                  </div>
                  {graphData && <div style={{ marginTop: 14, fontSize: 11, color: 'var(--text-3)' }}>
                    {graphData.nodes?.length || 0} nodes &middot; {graphData.edges?.length || 0} edges
                  </div>}
                </div>
              )}
            </div>
          </div>

          {tab === 'files' && <GraphFilesTab name={name} />}
        </div>
      );
    }

    function GraphFilesTab({ name }) {
      const [files, setFiles] = useState([]);
      useEffect(() => { api(`/graphs/${name}/files`).then(setFiles).catch(() => { }); }, [name]);

      return (
        <div style={{ overflow: 'auto' }}>
          <table className="task-table" style={{ width: '100%' }}>
            <thead><tr><th>File</th><th>Language</th><th>Nodes</th></tr></thead>
            <tbody>
              {files.map(f => (
                <tr key={f.path}>
                  <td style={{ fontFamily: 'var(--mono)', fontSize: 12 }}>{f.path}</td>
                  <td>{f.language}</td>
                  <td>{f.nodeCount ?? f.node_count}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    /* ── APP ──────────────────────────────────────────────── */
    function App() {
      const [authed, setAuthed] = useState(!!localStorage.getItem(TOKEN_KEY));
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [version, setVersion] = useState('');
      const { route, segs, nav } = useRouter();

      useEffect(() => {
        fetch(`${API_BASE}/health`).then(r => r.json()).then(d => setVersion(d.version || '')).catch(() => { });
      }, []);

      const handleLogout = () => { localStorage.removeItem(TOKEN_KEY); setAuthed(false); };
      const mobileNav = (path) => { nav(path); setSidebarOpen(false); };

      if (!authed) return <LoginScreen onAuth={() => setAuthed(true)} />;

      const view = segs[0] === 'project' && segs[1] ? 'project-detail'
        : segs[0] === 'graph' && segs[1] ? 'graph-detail'
          : (segs[0] || 'overview');
      const projectSlug = segs[0] === 'project' ? segs[1] : null;
      const graphName = segs[0] === 'graph' ? segs[1] : null;

      return (
        <div className="shell">
          <button className="mobile-toggle" onClick={() => setSidebarOpen(!sidebarOpen)}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12h18M3 6h18M3 18h18" /></svg>
          </button>
          <div className={`sidebar-overlay ${sidebarOpen ? 'open' : ''}`} onClick={() => setSidebarOpen(false)} />
          <Sidebar view={view === 'project-detail' ? 'projects' : view === 'graph-detail' ? 'graphs' : view} nav={mobileNav} onLogout={handleLogout} sidebarOpen={sidebarOpen} version={version} />
          <div className="main">
            <div className="topbar">
              <span className="topbar-title">
                {view === 'projects' && 'Projects'}
                {view === 'project-detail' && projectSlug}
                {view === 'overview' && 'Overview'}
                {view === 'search' && 'Search'}
                {view === 'graphs' && 'Graphs'}
                {view === 'graph-detail' && graphName}
              </span>
            </div>
            {view === 'projects' && <ProjectsView nav={nav} />}
            {view === 'project-detail' && projectSlug && <ProjectDetail slug={projectSlug} nav={nav} />}
            {view === 'overview' && <OverviewView nav={nav} />}
            {view === 'search' && <SearchView />}
            {view === 'graphs' && <GraphsView nav={nav} />}
            {view === 'graph-detail' && graphName && <GraphDetail name={graphName} nav={nav} />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
